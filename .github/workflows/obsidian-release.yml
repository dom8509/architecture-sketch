name: Obsidian release

# Tag = plugin version from apps/obsidian/manifest.json, e.g. `git tag 0.1.0 && git push origin 0.1.0`
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches the plugin version
        run: |
          test "$(node -p "require('./apps/obsidian/manifest.json').version")" = "${GITHUB_REF_NAME}"
          cmp manifest.json apps/obsidian/manifest.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:icons && npm run build -w @sysarch/obsidian
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "sysarch for Obsidian $GITHUB_REF_NAME" --generate-notes \
            apps/obsidian/dist/main.js apps/obsidian/dist/manifest.json apps/obsidian/dist/styles.css
