name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build documentation (examples in the docs, dead links)
        run: npm run docs:build
      - name: sysarch check
        run: node apps/cli/dist/main.js check examples library --max-warnings 0
      - name: sysarch fmt --check
        run: node apps/cli/dist/main.js fmt examples library --check
      - name: sysarch render
        run: node apps/cli/dist/main.js render examples --out build/examples
      - name: sysarch render (PNG, React Flow)
        run: |
          node apps/cli/dist/main.js render examples --format png --out build/examples
          node apps/cli/dist/main.js render examples --format reactflow --out build/examples
      - name: Rendered examples == golden files
        run: for f in build/examples/*.svg build/examples/*.reactflow.json; do cmp "$f" "tests/golden/$(basename "$f")"; done
      - uses: actions/upload-artifact@v4
        with:
          name: examples
          path: build/examples
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: obsidian-plugin
          path: apps/obsidian/dist
