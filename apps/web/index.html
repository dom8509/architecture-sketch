<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sysarch</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='4' width='5' height='8' rx='1' fill='%231d4ed8'/%3E%3Crect x='10' y='4' width='5' height='8' rx='1' fill='%231d4ed8'/%3E%3Cpath d='M6 8h4' stroke='%231d4ed8' stroke-width='1.5'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="toolbar">
      <strong class="brand">sysarch</strong>
      <span class="file" id="file-name">Draft</span>
      <div class="group">
        <button type="button" id="new" title="New architecture">New</button>
        <button type="button" id="open" title="Open file (⌘O)">Open</button>
        <button type="button" id="save" title="Save (⌘S)">Save</button>
        <select id="example" title="Load example">
          <option value="">Examples…</option>
        </select>
      </div>
      <div class="group">
        <label>Theme
          <select id="theme"><option value="">from the source</option></select>
        </label>
      </div>
      <div class="group">
        <span class="label">Export:</span>
        <button type="button" id="export-svg">SVG</button>
        <button type="button" id="copy-svg">Copy SVG</button>
        <button type="button" id="export-png">PNG</button>
        <select id="png-scale" title="PNG scale"></select>
        <button type="button" id="export-reactflow" title="Nodes, pins and routed edges for React Flow">React Flow</button>
      </div>
      <div class="group end">
        <button type="button" id="toggle-editor" title="Show or hide the editor (⌘E)">Editor</button>
        <button type="button" id="share" title="Copy a link with the source in the URL fragment">Share link</button>
        <button type="button" id="present" title="Presentation mode (Esc exits)">Present</button>
      </div>
    </header>
    <main class="workspace" id="workspace">
      <section class="pane editor-pane" id="editor" aria-label="DSL editor"></section>
      <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"></div>
      <section class="pane preview-pane" id="preview" aria-label="Preview">
        <div class="preview-tools">
          <button type="button" id="fit" title="Fit to view (double-click)">Fit</button>
        </div>
      </section>
    </main>
    <footer id="diagnostics" aria-label="Diagnostics"></footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="file-input" accept=".arch,.txt,text/plain" hidden />
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
